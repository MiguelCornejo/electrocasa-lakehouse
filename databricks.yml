bundle:
  name: electrocasa_lakehouse

include:
  - resources/*.yml

variables:
  catalog_name:
    description: Catalogo de Unity Catalog para el entorno
    default: electrocasa_dev

  landing_volume:
    description: Volume de archivos de entrada
    default: vol_landing

  warehouse_id:
    description: SQL Warehouse para tareas SQL
    default: ""

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog_name: electrocasa
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    variables:
      catalog_name: electrocasa_prod
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}